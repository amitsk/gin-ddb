basePath: /
host: localhost:3000
info:
  contact: {}
  description: 'Ski-lift records on DynamoDB: static, dynamic, and resort aggregates.'
  title: gin-ddb SkiLifts API
  version: 1.0.0
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Service info
  /api/skilifts:
    get:
      parameters:
      - description: page size
        in: query
        name: limit
        type: string
      - description: cursor
        in: query
        name: nextToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: List all records (scan, paginated)
  /api/skilifts/{lift}:
    get:
      parameters:
      - description: lift name
        in: path
        name: lift
        required: true
        type: string
      - description: page size
        in: query
        name: limit
        type: string
      - description: cursor
        in: query
        name: nextToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: List one lift's collection (paginated)
  /api/skilifts/{lift}/{metadata}:
    delete:
      parameters:
      - description: lift name
        in: path
        name: lift
        required: true
        type: string
      - description: static, resort, or MM/DD/YY
        in: path
        name: metadata
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Delete a record
    get:
      parameters:
      - description: lift name
        in: path
        name: lift
        required: true
        type: string
      - description: static, resort, or MM/DD/YY
        in: path
        name: metadata
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Get a single record
    put:
      consumes:
      - application/json
      parameters:
      - description: lift name
        in: path
        name: lift
        required: true
        type: string
      - description: resort or MM/DD/YY
        in: path
        name: metadata
        required: true
        type: string
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Partially update a dynamic or resort record
  /api/skilifts/{lift}/by-riders:
    get:
      parameters:
      - description: lift name
        in: path
        name: lift
        required: true
        type: string
      - description: page size
        in: query
        name: limit
        type: string
      - description: cursor
        in: query
        name: nextToken
        type: string
      - description: lower riders bound
        in: query
        name: minRiders
        type: string
      - description: upper riders bound
        in: query
        name: maxRiders
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: List one lift's records ordered by riders desc (paginated)
  /api/skilifts/{lift}/static:
    put:
      consumes:
      - application/json
      parameters:
      - description: lift name
        in: path
        name: lift
        required: true
        type: string
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Partially update a static record
  /api/skilifts/dynamic:
    post:
      consumes:
      - application/json
      parameters:
      - description: dynamic record
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "409":
          description: Conflict
          schema:
            type: object
      summary: Create a dynamic daily record
  /api/skilifts/resort:
    post:
      consumes:
      - application/json
      parameters:
      - description: resort record
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "409":
          description: Conflict
          schema:
            type: object
      summary: Create a resort aggregate record
  /api/skilifts/static:
    post:
      consumes:
      - application/json
      parameters:
      - description: static record
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "409":
          description: Conflict
          schema:
            type: object
      summary: Create a static lift record
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Liveness probe
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "503":
          description: Service Unavailable
          schema:
            type: object
      summary: Readiness probe (DynamoDB)
swagger: "2.0"
